version: "3.8"

services:
  # ============================================================================
  # Relational Database: PostgreSQL 16
  # Stores entity metadata, authentication states, findings, audit logs
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: shadowvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shadowvault_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadowvault_secure_password_replace}
      POSTGRES_DB: ${POSTGRES_DB:-shadowvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadowvault_app} -d ${POSTGRES_DB:-shadowvault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shadowvault-network

  # ============================================================================
  # Graph Database: Neo4j 5 Community
  # Models identity relationships, attack paths, transitive privilege reachability
  # ============================================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: shadowvault-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_graph_password_replace}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shadowvault-network

  # ============================================================================
  # Cache & Event Broker: Redis 7
  # Handles task dispatching, real-time event ingestion & rate limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: shadowvault-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shadowvault-network

  # ============================================================================
  # Backend API: FastAPI
  # High-performance async ITDR API and detection engines
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowvault-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-change-this-insecure-key-to-a-cryptographically-secure-random-token-32char}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-shadowvault_app}:${POSTGRES_PASSWORD:-shadowvault_secure_password_replace}@postgres:5432/${POSTGRES_DB:-shadowvault}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_graph_password_replace}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - shadowvault-network

  # ============================================================================
  # Background Worker: Celery
  # Executes asynchronous graph sync, scheduled detection runs, simulation jobs
  # ============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowvault-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-shadowvault_app}:${POSTGRES_PASSWORD:-shadowvault_secure_password_replace}@postgres:5432/${POSTGRES_DB:-shadowvault}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_graph_password_replace}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - shadowvault-network

  # ============================================================================
  # Frontend Application: Next.js 14
  # Interactive SOC Dashboard, React Flow attack path canvas, AI threat copilot
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowvault-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - shadowvault-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:

networks:
  shadowvault-network:
    driver: bridge
